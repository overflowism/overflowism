name: Optimize first Overflowism artwork (temporary)
on:
  push:
    branches:
      - artwork-first-collection
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert uploaded original to lightweight website JPEG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          old = Path('images/artworks/25218888-6B2C-4817-A892-AE31C950BC33.png')
          new = Path('images/artworks/untitled-the-bloom-web.jpg')
          data = Path('gallery-data.js')
          if not old.exists():
              print('Original image already optimized; no work required')
          else:
              with Image.open(old) as original:
                  img = ImageOps.exif_transpose(original).convert('RGB')
                  img.thumbnail((900, 1350), Image.Resampling.LANCZOS)
                  img.save(new, 'JPEG', quality=78, optimize=True, progressive=True)
              if new.stat().st_size > 300000:
                  with Image.open(new) as img:
                      img.save(new, 'JPEG', quality=68, optimize=True, progressive=True)
              content = data.read_text(encoding='utf-8')
              old_path = 'images/artworks/' + old.name
              new_path = 'images/artworks/' + new.name
              if old_path not in content:
                  raise RuntimeError('Original artwork reference not found; refusing to delete it')
              data.write_text(content.replace(old_path, new_path), encoding='utf-8')
              old.unlink()
              print('Optimized JPEG bytes:',new.stat().st_size)
          PY
      - name: Commit optimized artwork to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.js images/artworks/
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Untitled artwork for THE BLOOM"
            git push
          fi
