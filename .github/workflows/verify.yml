name: Verify emotional atlas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the build, rooms, portals and artwork
        run: npm test
      - name: Capture desktop preview if browser available
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage \
              --window-size=1440,1000 --virtual-time-budget=3000 \
              --screenshot="$PWD/preview-desktop.png" "file://$PWD/dist/index.html" || true
          fi
      - name: Verify live studio entrance initializes
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=1200 --dump-dom "file://$PWD/dist/index.html" > /tmp/overflowism-studio-dom.html
            grep -q 'data-studio-ready="yes"' /tmp/overflowism-studio-dom.html
            grep -q 'data-studio-stop="dance" aria-pressed="false"' /tmp/overflowism-studio-dom.html
            grep -q 'data-studio-stop="paint" aria-pressed="true"' /tmp/overflowism-studio-dom.html
            grep -q 'data-action="walk"' /tmp/overflowism-studio-dom.html
            echo "Studio JS initialized the current station, motion and accessible controls."
          else
            echo "No browser available; studio code and markup verified by npm test."
          fi
      - name: Verify Bloom experience renders in a browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=1800 --dump-dom "file://$PWD/dist/bloom.html" > /tmp/overflowism-bloom-dom.html
            grep -q 'data-ready="yes"' /tmp/overflowism-bloom-dom.html
            echo "Bloom canvas initialized in headless browser."
          else
            echo "No headless browser installed; JavaScript syntax and DOM contracts checked by npm test."
          fi
      - name: Verify Spiral world initializes in a browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=1800 --dump-dom "file://$PWD/dist/spiral.html" > /tmp/overflowism-spiral-dom.html
            grep -q 'data-ready="yes"' /tmp/overflowism-spiral-dom.html
            grep -q 'data-expanded="yes"' /tmp/overflowism-spiral-dom.html
            grep -q 'THE AFFIRMATION SPIRAL' /tmp/overflowism-spiral-dom.html
            echo "Spiral world initialized in headless browser."
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage \
              --window-size=1440,1000 --virtual-time-budget=2000 \
              --screenshot="$PWD/preview-spiral.png" "file://$PWD/dist/spiral.html" || true
          else
            echo "No headless browser installed; JavaScript syntax and DOM contracts checked by npm test."
          fi
      - name: Package interactive preview
        uses: actions/upload-artifact@v4
        with:
          name: overflowism-v2-preview
          path: |
            dist/**
            preview-desktop.png
            preview-spiral.png
          if-no-files-found: error
          retention-days: 14
