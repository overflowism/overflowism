name: Verify emotional atlas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the build, rooms, portals and artwork
        run: npm test
      - name: Capture desktop preview if browser available
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage \
              --window-size=1440,1000 --virtual-time-budget=3000 \
              --screenshot="$PWD/preview-desktop.png" "file://$PWD/dist/index.html" || true
          fi
      - name: Verify Bloom experience renders in a browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=1800 --dump-dom "file://$PWD/dist/bloom.html" > /tmp/overflowism-bloom-dom.html
            grep -q 'data-ready="yes"' /tmp/overflowism-bloom-dom.html
            echo "Bloom canvas initialized in headless browser."
          else
            echo "No headless browser installed; JavaScript syntax and DOM contracts checked by npm test."
          fi
      - name: Confirm live Bloom chapter URL
        shell: bash
        run: |
          set -e
          url="https://overflowism.lol/bloom.html"
          for attempt in 1 2 3 4 5; do
            status="$(curl -L --max-time 20 --silent --show-error -o /tmp/live-bloom.html -w '%{http_code}' "$url" || true)"
            echo "Attempt $attempt / LIVE_BLOOM_HTTP=$status"
            if [ "$status" = "200" ] && grep -q 'bloom-walk.js' /tmp/live-bloom.html; then
              echo "LIVE_BLOOM_VERIFIED=YES"
              exit 0
            fi
            sleep 8
          done
          echo "LIVE_BLOOM_VERIFIED=NO"
          exit 1
      - name: Package interactive preview
        uses: actions/upload-artifact@v4
        with:
          name: overflowism-v2-preview
          path: |
            dist/**
            preview-desktop.png
          if-no-files-found: error
          retention-days: 14
