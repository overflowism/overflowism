name: Verify emotional atlas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the build, rooms, portals and artwork
        run: npm test

      - name: Probe published Overflowism site URLs
        shell: bash
        run: |
          set +e
          for url in "https://overflowism.lol/" "https://overflowism.github.io/overflowism/"; do
            echo "CHECK_URL=$url"
            status=$(curl --location --max-time 20 --silent --show-error -o /tmp/overflowism-page.html -w '%{http_code}' "$url")
            code=$?
            echo "CURL_EXIT=$code HTTP_STATUS=$status"
            if [ "$code" -eq 0 ]; then
              echo "HAS_V2_TITLE=$(grep -c 'Welcome to the inside of my mind' /tmp/overflowism-page.html)"
              echo "HAS_IMMERSIVE_CSS=$(grep -c 'immersive.css' /tmp/overflowism-page.html)"
              head -c 180 /tmp/overflowism-page.html | tr '\\n' ' '
              echo
            fi
          done
      - name: Capture desktop preview if browser available
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage \
              --window-size=1440,1000 --virtual-time-budget=3000 \
              --screenshot="$PWD/preview-desktop.png" "file://$PWD/dist/index.html" || true
          fi
      - name: Package interactive preview
        uses: actions/upload-artifact@v4
        with:
          name: overflowism-v2-preview
          path: |
            dist/**
            preview-desktop.png
          if-no-files-found: error
          retention-days: 14
